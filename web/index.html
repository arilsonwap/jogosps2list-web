<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />

    <!-- Mobile Optimization -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=5, user-scalable=yes, viewport-fit=cover"
    />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0a7ea4" />

    <!-- SEO -->
    <meta name="description" content="Lista de jogos de PlayStation 2" />
    <meta name="keywords" content="ps2, playstation 2, jogos, games, lista" />

    <!-- Touch Icons -->
    <link rel="apple-touch-icon" href="/icon.png" />

    <title>Jogos PS2 List</title>

    <style>
      /* Prevent text size adjustment on mobile */
      html {
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Loading styles */
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #151718;
        }
      }

      /* Remove tap highlight on mobile */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
